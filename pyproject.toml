[project]
name = "fraud-detection-ml"
version = "0.1.0"
description = "End-to-end card-fraud detection: synthetic data, leakage-safe features, time-split evaluation, FastAPI scoring and drift monitoring."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "joblib>=1.4",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "pydantic>=2.8",
    "scikit-learn>=1.6",
    "uvicorn>=0.30",
]

[project.scripts]
fraud-ml = "fraud_detection.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "fraud_detection"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# Starlette suggests a successor client package; httpx still works for TestClient.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "PD", "RUF"]

[tool.ruff.format]
quote-style = "double"
